<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random PNG Clipboard</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#0d0d0f;color:#eee;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  display:grid;place-items:center;
}
.app{width:min(560px,calc(100% - 32px))}
h1{font-size:22px;margin:0 0 18px;font-weight:600}
.drop{
  min-height:260px;border:1px dashed #3b3b42;border-radius:14px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  cursor:pointer;transition:.15s;background:#111114;overflow:hidden;
}
.drop:hover,.drop.over{border-color:#777;background:#151518}
.drop.has-image{padding:12px}
.placeholder{color:#888;font-size:15px;line-height:1.6}
.placeholder b{color:#ddd;font-weight:500}
.preview{max-width:100%;max-height:330px;display:none;border-radius:8px}
.info{display:none;margin-top:12px;padding:13px 14px;background:#111114;border:1px solid #29292f;border-radius:10px}
.name{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcbcc4;word-break:break-all}
.actions{display:none;gap:10px;margin-top:12px}
button{
  flex:1;border:0;border-radius:9px;padding:12px 14px;
  background:#eee;color:#111;font-weight:600;cursor:pointer;
}
button.secondary{background:#222227;color:#ddd}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:13px;color:#777;margin-top:12px;min-height:18px}
input{display:none}
</style>
</head>
<body>
<main class="app">
  <h1>PNG Clipboard</h1>

  <div class="drop" id="drop">
    <div class="placeholder">
      <b>Ctrl + V</b> — вставить изображение<br>
      или перетащить файл сюда
    </div>
    <img class="preview" id="preview" alt="">
    <input id="file" type="file" accept="image/*">
  </div>

  <div class="info" id="info">
    <div class="name" id="name"></div>
  </div>

  <div class="actions" id="actions">
    <button id="copy">Скопировать в буфер</button>
    <button class="secondary" id="new">Очистить</button>
  </div>

  <div class="status" id="status"></div>
</main>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const placeholder = document.querySelector('.placeholder');
const info = document.getElementById('info');
const nameEl = document.getElementById('name');
const actions = document.getElementById('actions');
const copyBtn = document.getElementById('copy');
const newBtn = document.getElementById('new');
const status = document.getElementById('status');

let currentBlob = null;
let currentFile = null;
let previewUrl = null;

function randomName() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  let s = '';
  for (const b of bytes) s += chars[b % chars.length];
  return s + '.png';
}

async function toPng(file) {
  if (file.type === 'image/png') return file;

  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);
  bitmap.close();

  return await new Promise((resolve, reject) =>
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('PNG conversion failed')), 'image/png')
  );
}

async function processFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    status.textContent = 'Нужен файл изображения.';
    return;
  }

  try {
    currentBlob = await toPng(file);
    currentFile = new File([currentBlob], randomName(), {type:'image/png'});

    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(currentBlob);
    preview.src = previewUrl;

    placeholder.style.display = 'none';
    preview.style.display = 'block';
    drop.classList.add('has-image');

    nameEl.textContent = currentFile.name;
    info.style.display = 'block';
    actions.style.display = 'flex';
    status.textContent = 'Готово. Имя сгенерировано заново.';
  } catch (e) {
    status.textContent = 'Не удалось обработать изображение.';
    console.error(e);
  }
}

async function pasteImage(e) {
  const items = e.clipboardData?.items || [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      await processFile(item.getAsFile());
      e.preventDefault();
      return;
    }
  }
}

document.addEventListener('paste', pasteImage);

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => processFile(e.target.files[0]));

drop.addEventListener('dragover', e => {
  e.preventDefault();
  drop.classList.add('over');
});
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  processFile(e.dataTransfer.files[0]);
});

copyBtn.addEventListener('click', async () => {
  if (!currentBlob) return;

  try {
    if (!navigator.clipboard || !window.ClipboardItem) {
      throw new Error('Clipboard API unavailable');
    }

    // Записываем PNG в системный clipboard.
    // Это заменяет прежнее содержимое clipboard.
    const item = new ClipboardItem({
      'image/png': currentBlob
    });

    await navigator.clipboard.write([item]);
    status.textContent = 'Скопировано. Теперь Ctrl + V в нужном ИИ.';
  } catch (e) {
    console.error(e);
    status.textContent =
      'Браузер не разрешил запись в буфер. Нажми кнопку ещё раз или открой сайт через HTTPS/localhost.';
  }
});

newBtn.addEventListener('click', () => {
  currentBlob = null;
  currentFile = null;
  fileInput.value = '';

  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }

  preview.removeAttribute('src');
  preview.style.display = 'none';
  placeholder.style.display = 'block';
  drop.classList.remove('has-image');
  info.style.display = 'none';
  actions.style.display = 'none';
  status.textContent = '';
});
</script>
</body>
</html>
